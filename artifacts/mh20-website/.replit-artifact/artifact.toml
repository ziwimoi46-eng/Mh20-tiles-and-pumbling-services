kind = "web"
previewPath = "/"
title = "MH20 Tiles & Plumbing Services"
version = "1.0.0"
id = "artifacts/mh20-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20452

[services.development]
run = "pnpm --filter @workspace/mh20-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mh20-website", "run", "build" ]
publicDir = "artifacts/mh20-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20452"
BASE_PATH = "/"
